<section class="catalog-page">
    <!-- 1. Мінімалістичний випадковий тайтл -->
    <section class="random-showcase-card" id="random-showcase">
        <div class="showcase-bg-blur" id="sc-bg-blur"></div>
        <div class="showcase-content-grid">
            <div class="showcase-cover-box">
                <img id="sc-cover" src="" alt="Обкладинка" class="showcase-cover-img">
            </div>
            <div class="showcase-details">
                <div class="showcase-badge-row">
                    <span class="sc-badge featured">
                        <i data-lucide="sparkles" style="width: 11px; height: 11px;"></i> Випадковий
                    </span>
                    <span class="sc-badge" id="sc-type">Манхва</span>
                    <span class="sc-badge" id="sc-status">Завершено</span>
                </div>
                <h2 class="showcase-title-text" id="sc-title">Завантаження...</h2>
                <div class="showcase-meta-line" id="sc-meta-sub">Розділ 1</div>
            </div>
            <div class="showcase-btn-row">
                <button class="sc-roll-btn" id="sc-roll-btn" type="button" title="Обрати інший випадковий тайтл">
                    <i data-lucide="rotate-cw" style="width: 14px; height: 14px;"></i> <span>Інший</span>
                </button>
                <a id="sc-read-link" href="#" class="sc-read-btn" title="Читати">
                    <i data-lucide="book-open" style="width: 14px; height: 14px;"></i> <span>Читати</span>
                </a>
                <button class="showcase-close" id="sc-close-btn" type="button" title="Згорнути">
                    <i data-lucide="x" style="width: 15px; height: 15px;"></i>
                </button>
            </div>
        </div>
    </section>

    <!-- 2. Bento-стрічка швидких фільтрів (Тільки для ПК) -->
    <section class="hybrid-bento-strip">
        <!-- Формат -->
        <div class="b-module">
            <div class="b-module-label">
                <i data-lucide="layers" style="width: 13px; height: 13px;"></i>
                <span>Формат:</span>
            </div>
            <div class="b-chips-row" data-filter-group="type">
                <button type="button" class="b-filter-chip active" data-type="all">Всі</button>
                <button type="button" class="b-filter-chip" data-type="Манхва">Манхва</button>
                <button type="button" class="b-filter-chip" data-type="Манґа">Манґа</button>
                <button type="button" class="b-filter-chip" data-type="Маньхва">Маньхва</button>
                <button type="button" class="b-filter-chip" data-type="Роман">Роман</button>
            </div>
        </div>

        <!-- Статус -->
        <div class="b-module">
            <div class="b-module-label">
                <i data-lucide="activity" style="width: 13px; height: 13px;"></i>
                <span>Статус:</span>
            </div>
            <div class="b-chips-row" data-filter-group="status">
                <button type="button" class="b-filter-chip active" data-status="all">Всі</button>
                <button type="button" class="b-filter-chip" data-status="Виходить">Виходить</button>
                <button type="button" class="b-filter-chip" data-status="Завершено">Завершено</button>
                <button type="button" class="b-filter-chip" data-status="Закинуто">Закинуто</button>
            </div>
        </div>

        <!-- Обсяг (розділи) -->
        <div class="b-module">
            <div class="b-module-label">
                <i data-lucide="clock" style="width: 13px; height: 13px;"></i>
                <span>Обсяг:</span>
            </div>
            <div class="b-chips-row" data-filter-group="length">
                <button type="button" class="b-filter-chip active" data-len="all">Будь-який</button>
                <button type="button" class="b-filter-chip" data-len="short">&lt; 10 розділів</button>
                <button type="button" class="b-filter-chip" data-len="medium">10–50 розділів</button>
                <button type="button" class="b-filter-chip" data-len="long">50+ розділів</button>
            </div>
        </div>
    </section>

    <!-- 3. Основний макет: Контент + Бічна панель -->
    <div class="hybrid-main-layout">
        <!-- Основний контент -->
        <div class="main-content-flow">
            <!-- Повноширинний пошук -->
            <div class="catalog-search-fullwidth-wrap">
                <div class="ht-search-wrap">
                    <i data-lucide="search" class="ht-search-icon"></i>
                    <input type="search" id="search-input" class="ht-search-input" placeholder="Пошук за назвою або сюжетом..." autocomplete="off">
                    <button id="search-clear-btn" class="ht-search-clear" type="button" title="Очистити">
                        <i data-lucide="x" style="width: 15px; height: 15px;"></i>
                    </button>
                </div>
            </div>

            <!-- Підрядок інструментів: Лічильник результатів + Сортування + Вигляд -->
            <div class="catalog-sub-toolbar">
                <div class="catalog-counter-text">
                    Знайдено: <strong id="catalog-count-num">0</strong> тайтлів
                </div>
                <div class="ht-actions-wrap">
                    <!-- Сортування -->
                    <select id="catalog-sort" class="ht-sort-select">
                        <option value="newest">За оновленням</option>
                        <option value="chapters">За кількістю розділів</option>
                        <option value="az">За назвою (А-Я)</option>
                        <option value="za">За назвою (Я-А)</option>
                    </select>

                    <!-- Перемикач режиму відображення (Сітка / Список) -->
                    <div class="view-toggle-pill">
                        <button type="button" class="vt-btn active" id="vt-grid" title="Сітка постерів 2:3">
                            <i data-lucide="layout-grid" style="width: 14px; height: 14px;"></i>
                        </button>
                        <button type="button" class="vt-btn" id="vt-stream" title="Детальний список">
                            <i data-lucide="stretch-horizontal" style="width: 14px; height: 14px;"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Рядок активних фільтрів -->
            <div class="active-chips-strip" id="active-chips-strip" style="display: none;"></div>

            <!-- Сітка тайтлів / список -->
            <div class="manga-grid" id="catalog-manga-grid"></div>
        </div>

        <!-- 4. Класична закріплена бічна панель (ПК) -->
        <aside class="classic-sidebar">
            <div class="cs-header">
                <h3><i data-lucide="sliders-horizontal" style="width: 16px; height: 16px;"></i> Фільтри</h3>
                <button type="button" class="cs-reset-btn" id="sidebar-reset-btn">
                    <i data-lucide="rotate-ccw" style="width: 12px; height: 12px;"></i> Скинути
                </button>
            </div>

            <!-- Жанри з 3-позиційними чіпами та пошуком -->
            <div class="cs-section">
                <div class="cs-section-title">
                    <span>Жанри</span>
                </div>
                <div class="genre-search-field">
                    <input type="text" id="sidebar-genre-search" placeholder="Пошук жанрів..." autocomplete="off">
                </div>
                <div class="genre-chips-wrap" id="sidebar-genre-chips">
                    <!-- Заповнюється динамічно через catalog.js -->
                </div>
            </div>

            <!-- Формат -->
            <div class="cs-section">
                <div class="cs-section-title"><span>Тип</span></div>
                <div class="b-chips-row" id="sidebar-type-chips">
                    <button type="button" class="b-filter-chip active" data-type="all">Всі</button>
                    <button type="button" class="b-filter-chip" data-type="Манхва">Манхва</button>
                    <button type="button" class="b-filter-chip" data-type="Манґа">Манґа</button>
                    <button type="button" class="b-filter-chip" data-type="Маньхва">Маньхва</button>
                    <button type="button" class="b-filter-chip" data-type="Роман">Роман</button>
                </div>
            </div>

            <!-- Статус -->
            <div class="cs-section">
                <div class="cs-section-title"><span>Статус</span></div>
                <div class="b-chips-row" id="sidebar-status-chips">
                    <button type="button" class="b-filter-chip active" data-status="all">Всі</button>
                    <button type="button" class="b-filter-chip" data-status="Виходить">Виходить</button>
                    <button type="button" class="b-filter-chip" data-status="Завершено">Завершено</button>
                    <button type="button" class="b-filter-chip" data-status="Закинуто">Закинуто</button>
                </div>
            </div>

            <!-- Обсяг (розділи) -->
            <div class="cs-section">
                <div class="cs-section-title"><span>Обсяг</span></div>
                <div class="b-chips-row" id="sidebar-length-chips">
                    <button type="button" class="b-filter-chip active" data-len="all">Будь-який</button>
                    <button type="button" class="b-filter-chip" data-len="short">&lt; 10</button>
                    <button type="button" class="b-filter-chip" data-len="medium">10–50</button>
                    <button type="button" class="b-filter-chip" data-len="long">50+</button>
                </div>
            </div>
        </aside>
    </div>

    <!-- 5. Плаваючий блок фільтрів для мобільних пристроїв -->
    <div class="mobile-filter-dock">
        <button type="button" class="dock-btn primary" id="mobile-dock-filter-btn">
            <i data-lucide="filter" style="width: 15px; height: 15px;"></i>
            <span>Фільтри</span>
            <span class="dock-count-badge" id="mobile-dock-counter">0</span>
        </button>
        <button type="button" class="dock-btn" id="mobile-dock-random-btn">
            <i data-lucide="dices" style="width: 15px; height: 15px;"></i>
            <span>Рандом</span>
        </button>
    </div>

    <!-- 6. Мобільний Bottom Sheet (шторка фільтрів) -->
    <div class="sheet-backdrop" id="sheet-backdrop"></div>
    <div class="bottom-sheet" id="bottom-sheet">
        <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
        <div class="sheet-head">
            <h3>Фільтри каталогу</h3>
            <button type="button" class="sheet-close" id="sheet-close-btn">&times;</button>
        </div>
        <div class="sheet-content" id="sheet-content-body">
            <!-- Заповнюється динамічно через catalog.js -->
        </div>
        <div class="sheet-actions">
            <button type="button" class="sheet-reset" id="sheet-reset-btn">Скинути</button>
            <button type="button" class="sheet-apply" id="sheet-apply-btn">Показати тайтли</button>
        </div>
    </div>

    <!-- 7. Модальне вікно швидкого перегляду (Quick-View) -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="qv-window" id="qv-window">
            <button type="button" class="qv-close" id="qv-close-btn">&times;</button>
            <div id="modal-content-area" class="modal-content-area"></div>
        </div>
    </div>
</section>

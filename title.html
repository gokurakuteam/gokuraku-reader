<div id="background-image" class="background-image"></div>
<section class="title-page" style="position: relative;">
    <header class="title-header">
        <div class="title-cover">
            <img src="" alt="Обкладинка манги">
        </div>
        <div class="title-info">
            <h1></h1>
            <div class="title-meta-info"></div>
            <div class="genres"></div>
            <p></p>
            <div class="title-actions">
                <a href="#" class="button read-button">Читати</a>
                <button id="bookmark-btn" class="button">
                    <i data-lucide="bookmark" class="icon"></i>
                    <span class="text">В закладки</span>
                </button>
            </div>
        </div>
    </header>

    <main class="title-content">
        <!-- СТВОРЮЄМО КОНТЕЙНЕР ДЛЯ ВКЛАДОК -->
        <div class="tabs">
            <button class="tab-link active" data-tab="chapters">Розділи</button>
            <button class="tab-link" data-tab="comments">Коментарі</button>
        </div>

        <!-- ВКЛАДКА З РОЗДІЛАМИ (АКТИВНА ЗА ЗАМОВЧУВАННЯМ) -->
        <div id="chapters" class="tab-content active">
            <section class="chapter-list">
                <div class="list-header">
                    <h2>Розділи</h2>
                    <div class="chapter-actions">
                        <button id="sort-chapters-btn" class="icon-button" title="Сортувати розділи">
                            <i data-lucide="arrow-down-up"></i>
                        </button>
                        <button id="batch-download-btn" class="icon-button" title="Завантажити декілька розділів">
                            <i data-lucide="download-cloud"></i>
                        </button>
                        <button id="read-all-btn" class="icon-button" title="Позначити все прочитаним">
                            <i data-lucide="check-square"></i>
                        </button>
                    </div>
                </div>
                <ul>
                    <!-- Розділи будуть динамічно вставлені сюди -->
                </ul>
            </section>
        </div>

        <!-- ВКЛАДКА З КОМЕНТАРЯМИ -->
        <div id="comments" class="tab-content">
            <div id="giscus-container">
                <!-- Giscus буде завантажено сюди -->
            </div>
        </div>
    </main>
</section>

<div class="tabs">
    <button class="tab-link active" data-tab="bookmarks"><i data-lucide="bookmark" class="tab-icon" style="margin-right:8px;"></i> Збережене</button>
    <button class="tab-link" data-tab="history"><i data-lucide="history" class="tab-icon" style="margin-right:8px;"></i> Історія</button>
    <button class="tab-link icon-tab-link" data-tab="clicker" title="Налаштування та Клікер">
        <i data-lucide="settings" class="tab-icon"></i>
    </button>
</div>

<div id="bookmarks" class="tab-content active">
    <div id="bookmarks-container">
        <div class="category-tabs-header">
            <div class="category-tabs"></div>
            <button id="manage-categories-btn" class="icon-button" title="Керувати категоріями">
                <i data-lucide="folders"></i>
            </button>
        </div>
        <div class="category-content-container"></div>
    </div>
    <p class="empty-list-message" style="display: none;">Ваш список збереженого порожній.</p>
</div>

<div id="history" class="tab-content">
    <h2>Історія переглядів</h2>
    <ul class="update-list history-list"></ul>
    <p class="empty-list-message" style="display: none;">Ваша історія переглядів порожня.</p>
</div>

<div id="clicker" class="tab-content">
    <!-- Перемикач Теми -->
    <div class="theme-mode-container">
        <h3>Режим відображення</h3>
        <div class="theme-switcher">
            <input type="radio" id="theme-light" name="theme-mode" value="light">
            <label for="theme-light"><i data-lucide="sun"></i>Світла</label>
            <input type="radio" id="theme-system" name="theme-mode" value="system">
            <label for="theme-system"><i data-lucide="monitor"></i>Системна</label>
            <input type="radio" id="theme-dark" name="theme-mode" value="dark">
            <label for="theme-dark"><i data-lucide="moon"></i>Темна</label>
            <div class="slider-bg"></div>
        </div>
    </div>

    <hr class="cabinet-separator">

    <div class="clicker-game-container">
        <div class="score-board">
            <span id="clicker-score">0</span> 🪙
        </div>
        
        <div class="clicker-area">
            <div class="clicker-bg-glow"></div>
            <img id="active-chibik" src="" alt="Chibik" class="chibik-image">
        </div>
        <h3 id="active-char-name" style="text-align: center; margin-top: 0.5rem;">Персонаж</h3>

        <!-- Секції Магазину -->
        <div class="shop-container">
            <!-- 1. Теми (Акцентні кольори) -->
            <h3 class="shop-section-title">Теми</h3>
            <div id="themes-list" class="shop-items-grid"></div>

            <hr class="cabinet-separator" style="margin: 1.5rem 0;">

            <!-- 2. Персонажі та Скіни -->
            <div class="character-shop-wrapper">
                <h3 class="shop-section-title">Вибір Персонажа</h3>
                <div id="characters-list" class="shop-items-row"></div>

                <div class="skins-panel">
                    <h3 class="shop-section-title" style="margin-top: 1.5rem;">Скіни</h3>
                    <div id="skins-list" class="shop-items-row"></div>
                </div>
            </div>
        </div>
    </div>
</div>
